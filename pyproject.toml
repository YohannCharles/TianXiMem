[project]
name = "tianximem"
version = "0.0.0"
description = "TianXiMem - AML Agentic Memory service with Add/Search HTTP endpoints"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "qdrant-client>=1.17,<1.18",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tianximem"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["spacy", "spacy.*"]
ignore_missing_imports = true
