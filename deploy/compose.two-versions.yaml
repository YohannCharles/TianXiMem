# Optional second application container for version comparison.

services:
  app-v10:
    image: "${TIANXIMEM_V10_IMAGE:-tianximem:v1.0}"
    container_name: tianxi-app-v10
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${TIANXIMEM_BIND:-127.0.0.1}:${TIANXIMEM_V10_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      TIANXIMEM_QDRANT_URL: "${TIANXIMEM_QDRANT_URL:-http://qdrant:6333}"
      TIANXIMEM_PROFILE: "${TIANXIMEM_V10_PROFILE:-v10}"
      TIANXIMEM_SQLITE_PATH: /data/tianxi.db
      TIANXIMEM_EMBED_CACHE_DIR: /data/embed_cache
      TIANXIMEM_WORKERS: "1"
      TIANXIMEM_CONFIG_DIR: "${TIANXIMEM_V10_CONFIG_DIR:-/configs}"
    volumes:
      - tianxi_data_v10:/data
      - "${TIANXIMEM_V10_CONFIG_DIR:-./configs-v10}:/configs:ro"
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,httpx; sys.exit(0 if httpx.get('http://127.0.0.1:8000/health', timeout=4).status_code == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  tianxi_data_v10:
