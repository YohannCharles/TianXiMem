# Qdrant server —— 本项目的派生索引（§6.3 / §7.3）
#
# 起：  docker compose -f deploy/compose.yaml up -d
# 停：  docker compose -f deploy/compose.yaml down
#
# ⚠ 为什么必须是 server 模式而不是 qdrant-client 的 local 模式：
#   local 模式会【静默丢弃 payload 索引】——create_payload_index 只打一行警告就返回，
#   且其数据格式与 server 不兼容。而本项目的 user_id / session_id / event_time
#   三个筛选全部依赖 payload 索引。没有降级方案。
#
# ⚠ 为什么 tag 钉死到完整版本号：
#   {rrf: {weights, k}} 的 weights 自 v1.17.0 起才可用（k 自 v1.16.0）。
#   融合行为的任何变化都会改变排名，而 Full 只有 2 次、一旦接受即版本冻结——
#   浮动的 tag 会让"这个分数是哪个版本跑的"变成不可回答的问题。
#   【不要改成 latest 或大版本浮标。】升级要先看 §7.3 的版本门槛。

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: tianxi-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST —— 服务与 harness 都走这个
      - "6334:6334"   # gRPC
    volumes:
      # 派生数据的落点。Qdrant 可从 SQLite 全量重建，所以这个卷【不是备份对象】——
      # 真正的备份对象是 SQLite 真源文件（见 deploy/README.md §4 的重建 runbook）。
      #
      # ⚠ 用【命名卷】而不是 Windows 路径的绑定挂载：Docker Desktop 会把 Windows 路径
      #   经共享文件系统层（virtiofs/9p）送进 Linux VM，而 Qdrant 是大量小文件 +
      #   mmap 读 segment，正是最不适合该层的访问模式。命名卷落在 VM 自己的 ext4 上。
      #   代价是数据不再是 Windows 上可见的文件夹——但如上所述，它本来就不是备份对象。
      - qdrant_storage:/qdrant/storage
    environment:
      # 单进程 24×7 运行（Full run 持续 0.5–2 天）。日志级别按需调。
      QDRANT__LOG_LEVEL: INFO

volumes:
  # 落在 Docker Desktop 的 VM 内 ext4 上，不走 Windows 共享文件系统层（见上文的挂载说明）。
  # Qdrant 可从 SQLite 全量重建 ⇒ 这个卷不是备份对象，删掉即可重建。
  qdrant_storage:

# 注意：以下集合级设置【不在本文件里】，由客户端在建集合时施加（src/tianxi_am/store/）：
#   - 分片数 = 1            （根级融合跨分片合并，分片数变化会改变排名且无报错）
#   - 命名向量 dense + bm25 （稀疏向量距离固定为 Dot）
#   - payload 索引          （必须在写入数据前建，否则 HNSW 需重建才有过滤感知）
#   - 写入 wait=true        （契约要求"响应前立即可搜"）
#
# 部署位置（2026-09-23 定，见 docs/decisions.md D12）：
#   检索服务 + Qdrant 跑在【本机】；三段模型经自建网关远程访问；harness 也在本机。
#   本机已装 Docker Desktop 29.8.0（desktop-linux context，WSL2 后端，无额外用户发行版）：
#   daemon 走 Windows 命名管道 ⇒ docker 命令直接从 Git Bash 可用，不必进 WSL；
#   容器虽在 Docker Desktop 的 VM 内，但发布端口转发到 Windows 主机 ⇒
#   服务在本机访问 localhost:6333 成立。**本机无 GPU，但已不需要**（模型不在本机）。
