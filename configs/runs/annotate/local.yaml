# 相对时间注解臂 —— 冻结于 2026-09-26（UTC）
# 基线 default.yaml 与 `configs/runs/t1-dated-cov/` 逐字相同（同一次冻结的副本）。
# 相对它动三件事：
#   · packaging.annotate_relatives=true —— 正文里的相对时间**就地注解**（**只改 content**）
#   · packaging.inject_abs_time=true    —— 日期前缀（D21，与 t1-dated 臂一致）
#   · storage.qdrant.collection=memories_t1_dated —— 复用那份已建好的索引
#     （**注解不进索引**，所以本臂与 t1-dated 臂可以共用一个集合——这正是它与
#      `inject_abs_time` 的区别：那个必须分集合，这个不必）
packaging:
  inject_abs_time: true
  annotate_relatives: true
storage:
  qdrant:
    collection: memories_t1_dated
